# compose.yaml
version: '3.8'

services:
  # ---------------------------------------------------------
  # THE AGGREGATOR: Bound to the host CPU (No GPU access)
  # ---------------------------------------------------------
  server:
    image: docker.io/library/python:3.11-slim
    container_name: fl_aggregator_node
    volumes:
      - .:/app
    working_dir: /app
    # Execute our CPU-bound averaging logic
    # UPDATE (SSL Bypass): Added --trusted-host flags to prevent certificate verification
    # failures when downloading PyTorch inside the isolated rootless namespace.
    command: bash -c "pip install --trusted-host pypi.org --trusted-host files.pythonhosted.org torch grpcio grpcio-tools protobuf && python src/server.py"
    ports:
      - "50052:50052"
    networks:
      - federated_network

  # ---------------------------------------------------------
  # CLIENT 1: Bound explicitly to your NVIDIA RTX 4070
  # ---------------------------------------------------------
  client_sahakarnagar_01:
    image: docker.io/library/python:3.11-slim
    container_name: fl_client_node_1
    volumes:
      - .:/app
      # UPDATE (NixOS Specific): Mount the host's hardware-bound driver libraries directly.
      # This bypasses the broken CDI generator by supplying the libcuda.so.1 library manually.
      - /run/opengl-driver/lib:/usr/lib/nvidia:ro
    # UPDATE (Linker Injection): Instruct the isolated container's linker where to find the newly mounted drivers.
    environment:
      - LD_LIBRARY_PATH=/usr/lib/nvidia
    working_dir: /app
    
    # We must explicitly request the NVIDIA container toolkit capabilities here
    # UPDATE (Hardware Mapping): The original 'deploy: resources' CDI block caused a SIGABRT
    # due to the unique NixOS filesystem structure. We have replaced it by explicitly mapping
    # the exact kernel character devices required for parallel CUDA execution.
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      
    # UPDATE (SSL Bypass): Synchronized the --trusted-host flags for the client node as well.
    command: bash -c "pip install --trusted-host pypi.org --trusted-host files.pythonhosted.org torch grpcio grpcio-tools protobuf && sleep 5 && python src/client.py"
    networks:
      - federated_network
    depends_on:
      - server

networks:
  # Create a dedicated, isolated software-defined network for our nodes
  federated_network:
    driver: bridge
