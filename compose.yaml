# compose.yaml
version: '3.8'

services:
  # ---------------------------------------------------------
  # THE AGGREGATOR: Bound to the host CPU (No GPU access)
  # ---------------------------------------------------------
  server:
    image: docker.io/library/python:3.11-slim
    container_name: fl_aggregator_node
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command: bash -c "pip install --trusted-host pypi.org --trusted-host files.pythonhosted.org torch numpy grpcio grpcio-tools protobuf && python src/server.py"
    ports:
      - "50052:50052"
    networks:
      - federated_network

  # ---------------------------------------------------------
  # CLIENT 1: Bound explicitly to your NVIDIA RTX 4070
  # ---------------------------------------------------------
  client_sahakarnagar_01:
    image: docker.io/library/python:3.11-slim
    container_name: fl_client_node_1
    volumes:
      - .:/app
      - /run/opengl-driver/lib:/usr/lib/nvidia:ro
      - /nix/store:/nix/store:ro
    environment:
      - LD_LIBRARY_PATH=/usr/lib/nvidia
      - CLIENT_ID=node_sahakarnagar_01_RTX4070
      - SERVER_ADDR=server:50052
      - PYTHONUNBUFFERED=1
    working_dir: /app
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    command: bash -c "pip install --trusted-host pypi.org --trusted-host files.pythonhosted.org torch numpy grpcio grpcio-tools protobuf && sleep 5 && python src/client.py"
    networks:
      - federated_network
    depends_on:
      - server

  # ---------------------------------------------------------
  # CLIENT 2 (Edge Compute): Bound to AMD Radeon 890M (ROCm)
  # ---------------------------------------------------------
  client_belur_02:
    image: docker.io/library/python:3.11-slim
    container_name: fl_client_node_2
    volumes:
      - .:/app
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - CLIENT_ID=node_belur_02_Radeon890M
      - SERVER_ADDR=server:50052
      - PYTHONUNBUFFERED=1
      # =========================================================================
      # CRITICAL UPDATE: APU DEADLOCK BYPASS
      # =========================================================================
      # Disables the SDMA engine. APUs share physical RAM with the CPU, and 
      # allowing containerized ROCm to use SDMA causes silent PCI bus deadlocks.
      - HSA_ENABLE_SDMA=0
    working_dir: /app
    privileged: true
    ipc: host
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
      
    # UPDATE (Dependency Routing): Added `libnuma1` to the apt-get install phase 
    # to ensure the HSA runtime can correctly map APU memory nodes.
    command: >
      bash -c "apt-get update && apt-get install -y patchelf libnuma1 && 
      pip install --trusted-host pypi.org --trusted-host files.pythonhosted.org numpy grpcio grpcio-tools protobuf && 
      pip install --trusted-host pypi.org --trusted-host download.pytorch.org torch --index-url https://download.pytorch.org/whl/rocm6.0 && 
      echo '[SYSTEM] Scanning and patching ROCm binaries with patchelf...' && 
      find /usr/local -name 'libamdhip64.so' -exec patchelf --clear-execstack {} + && 
      find /usr/local -name 'libhiprtc.so' -exec patchelf --clear-execstack {} + && 
      echo '[SYSTEM] Patch complete. Staggering connection (15s)...' && 
      sleep 15 && 
      python src/client.py"
    networks:
      - federated_network
    depends_on:
      - server

networks:
  federated_network:
    driver: bridge
